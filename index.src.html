<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Throughput</title>
<style>
__SHELL_CSS__
__KIT_CSS__
/* Throughput additions (shell from Blast Radius, Nov 23) */
:root { --c1: #1c55d4; --c2: #b3541e; --c3: #7b3fb6; --c4: #0f7d6a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c1: #86a8ff; --c2: #f0a167; --c3: #c39bf0; --c4: #5fd0bb; } }
:root[data-theme="dark"] { --c1: #86a8ff; --c2: #f0a167; --c3: #c39bf0; --c4: #5fd0bb; }
.lanelist { display: grid; gap: 10px; }
.lanebtn { appearance: none; width: 100%; text-align: left; cursor: pointer; background: var(--sheet); color: var(--ink);
  border: 1px solid var(--rule); border-left: 6px solid var(--deck); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; min-height: 64px; }
.lanebtn:hover:not(:disabled) { border-color: var(--marker); border-left-color: var(--deck); }
.lanebtn:disabled { cursor: default; opacity: .6; border-left-style: dashed; }
.lanebtn .nm { font-weight: 700; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.lanebtn .bl { color: var(--muted); font-size: 14px; line-height: 1.35; }
.lanebtn .st { font-family: var(--f-mono); font-size: 12px; color: var(--marker); font-weight: 600; }
.lanebtn:disabled .st { color: var(--muted); }
.secrow { display: grid; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.secrow:last-child { border-bottom: 0; }
.secrow .top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; justify-content: space-between; }
.secrow b { font-size: 16px; overflow-wrap: anywhere; }
.k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.soon { font-family: var(--f-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.items { display: grid; gap: 8px; margin-top: 6px; }
.itemrow { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--board); color: var(--ink); text-decoration: none; min-height: 44px; }
.itemrow:hover { border-color: var(--marker); }
.itemrow .top { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; justify-content: space-between; }
.itemrow b { font-size: 15.5px; overflow-wrap: anywhere; }
.prose p { font-size: 16px; line-height: 1.55; }
.stem { font-size: 17px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.src { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; overflow-wrap: anywhere; }
.lvchip { font-family: var(--f-mono); font-size: 11.5px; padding: 2px 7px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.stat > div { background: var(--board); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--f-display); font-weight: 780; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .l { color: var(--muted); font-size: 13px; }
.flash { min-height: 150px; display: grid; gap: 10px; align-content: center; text-align: center; }
.flash .front { font-family: var(--f-display); font-weight: 780; font-size: 22px; overflow-wrap: anywhere; }
.flash .back { font-size: 16.5px; line-height: 1.5; overflow-wrap: anywhere; }
.qty { display: flex; align-items: stretch; gap: 8px; }
.qty input { width: 100%; max-width: 140px; min-height: 48px; font-size: 22px; font-weight: 700; text-align: center; border: 1px solid var(--rule); border-radius: 10px; background: var(--sheet); color: var(--ink); font-variant-numeric: tabular-nums; }
.qty .btn { min-width: 48px; font-size: 20px; }
.scroll { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
table.t th, table.t td { padding: 6px 8px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t th { font-weight: 600; color: var(--muted); font-size: 13px; }
.fig { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.seats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.seats .tog { white-space: normal; text-align: left; }
.foot { color: var(--muted); font-size: 13px; display: grid; gap: 6px; }
.cfm { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.45); }
.cfm-box { width: min(420px, 100%); background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 12px; padding: 18px; display: grid; gap: 10px; }
.cfm-box h2 { margin: 0; font-size: 18px; } .cfm-box p { margin: 0; color: var(--muted); }
figure.lfig { margin: 0; display: grid; gap: 6px; }
.timer { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 700; }
.timer.low { color: var(--warn); }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.mgrid button { min-height: 44px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); color: var(--ink); font-family: var(--f-mono); font-size: 13px; cursor: pointer; padding: 0; }
.mgrid button.ans { background: var(--sunk); }
.mgrid button.flg { border: 2px solid var(--warn); }
.mgrid button.cur { outline: 2px solid var(--marker); outline-offset: 1px; }
.opt.is-picked { border-color: var(--marker); box-shadow: inset 0 0 0 2px var(--marker); }
</style>
</head>
<body>
<div id="app"></div>
<script>const BANK = __BANK__;</script>
<script>__STUDY_KIT__</script>
<script>__BEER_ENGINE__</script>
<script>
(function () {
  'use strict';
  const K = window.StudyKit, BG = window.BeerEngine, app = document.getElementById('app');
  const APP = 'throughput';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '\'': '&#39;' }[c]));
  const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const LANES = BANK.lanes, SECTIONS = BANK.sections, DECKS = BANK.decks, BEER = BANK.beer;
  const laneById = id => LANES.find(l => l.id === id);
  const deckById = id => DECKS.find(d => d.id === id);
  const QS = {}, LESSONS = {}, CARDS = {};
  DECKS.forEach(d => { d.questions.forEach(q => { QS[q.id] = Object.assign({ deck: d.id }, q); }); d.lessons.forEach(l => { LESSONS[l.id] = Object.assign({ deck: d.id }, l); }); d.cards.forEach(c => { CARDS[c.id] = Object.assign({ deck: d.id }, c); }); });
  let SCREEN = 'home', VIEW = {}, SAMPLE = null;
  const money2 = h => '$' + (h / 2).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });   // half-dollars to dollars

  // ---- stores (study-kit's save helper): prefs, deck progress, Beer Game
  const status = () => { for (const [id, s] of [['prefs-saved', prefs], ['deck-saved', decks], ['beer-saved', beer], ['mock-saved', mock]]) { const el = document.getElementById(id); if (el && s) el.textContent = s.statusText(); } };
  const keep = ok => x => { const o = {}; if (!x || typeof x !== 'object') return o; for (const k in x) if (ok(k) && x[k] && typeof x[k] === 'object' && typeof x[k].ts === 'number') o[k] = JSON.parse(JSON.stringify(x[k])); return o; };
  const prefs = K.save.createStore({ localKey: APP + ':prefs:v1', doc: 'prefs', field: 'prefs', normalize: keep(k => k === 'lane'), onRemote() { if (SCREEN === 'home') host.keepScroll(); }, onStatus: () => status() });
  const decks = K.save.createStore({ localKey: APP + ':decks:v1', doc: 'decks', field: 'decks', normalize: keep(k => !!(QS[k] || CARDS[k])),
    onRemote() { if (['deck', 'lesson', 'lane', 'cards'].indexOf(SCREEN) !== -1) host.keepScroll(); }, onStatus: () => status() });
  const beer = K.save.createStore({ localKey: APP + ':beer:v1', doc: 'beer', field: 'beer', normalize: keep(k => /^(game|last|seat-[0-3])$/.test(k)),
    onRemote() { if (SCREEN === 'beer' || SCREEN === 'home') host.keepScroll(); }, onStatus: () => status() });
  // Timed mock: the run in progress ('run') and the last result ('last'). Separate from deck progress.
  const MOCK = BANK.mock;
  const mock = K.save.createStore({ localKey: APP + ':mock:v1', doc: 'mock', field: 'mock', normalize: keep(k => k === 'run' || k === 'last'),
    onRemote() { if (SCREEN === 'mock' || SCREEN === 'lane') host.keepScroll(); }, onStatus: () => status() });
  prefs.loadLocal(); decks.loadLocal(); beer.loadLocal(); mock.loadLocal();
  // A finished or abandoned game is stored as { done: true }, so other devices drop it too.
  const game = () => { const v = beer.get('game'); return v && !v.done ? v : undefined; };

  // ---- theme (this device only)
  const THEME_KEY = APP + ':theme';
  function theme() { try { return localStorage.getItem(THEME_KEY) || 'system'; } catch (e) { return 'system'; } }
  function applyTheme(t) { if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
  applyTheme(theme());

  const host = {
    esc,
    screen: () => SCREEN,
    view: () => VIEW,
    go(screen, view) { SCREEN = screen; VIEW = view || {}; render(); window.scrollTo(0, 0); },
    render: () => render(),
    keepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); },
    paint(html) { app.innerHTML = html; },
    header: (title, act, id, label, meta) => '<div class="playtop"><div class="wrap"><button class="iconbtn" data-act="' + act + '"' + (id ? ' data-id="' + esc(id) + '"' : '') + ' aria-label="' + esc(label) + '">' + X + '</button><h1 class="ttl">' + esc(title) + '</h1><span class="meta">' + esc(meta || '') + '</span></div></div>',
    listHeader: title => '<div class="playtop"><div class="wrap"><button class="iconbtn" data-act="home" aria-label="Back to start">' + X + '</button><h1 class="ttl">' + esc(title) + '</h1><span class="meta"></span></div></div>',
    sampler: () => SAMPLE,
    samplerGone() { SAMPLE = null; },
    toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); },
    // In-page dialog: the claude.ai artifact frame refuses window.confirm (it returns without asking), so a native
    // confirm made Submit (with unanswered questions) and every Abandon button do nothing on the live page.
    confirm(title, body, ok, cb) {
      const prev = document.activeElement, d = document.createElement('div');
      d.className = 'cfm'; d.setAttribute('role', 'alertdialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-labelledby', 'cfm-t'); d.setAttribute('aria-describedby', 'cfm-b');
      d.innerHTML = '<div class="cfm-box"><h2 id="cfm-t">' + esc(title) + '</h2><p id="cfm-b">' + esc(body) + '</p><div class="row"><button class="btn btn-primary" data-cfm="ok">' + esc(ok || 'OK') + '</button><button class="btn" data-cfm="cancel">Cancel</button></div></div>';
      const close = yes => { d.remove(); document.removeEventListener('keydown', key, true); if (prev && prev.focus) try { prev.focus(); } catch (e) {} if (yes) cb(); };
      const key = e => { if (e.key === 'Escape') { e.preventDefault(); close(false); } else if (e.key === 'Tab') { const b = d.querySelectorAll('button'); if (e.shiftKey ? document.activeElement === b[0] : document.activeElement === b[b.length - 1]) { e.preventDefault(); (e.shiftKey ? b[b.length - 1] : b[0]).focus(); } } };
      d.addEventListener('click', e => { const t = e.target.closest('[data-cfm]'); if (t) close(t.dataset.cfm === 'ok'); else if (e.target === d) close(false); });
      document.addEventListener('keydown', key, true); document.body.appendChild(d); d.querySelector('[data-cfm="cancel"]').focus();
    },
    copy(text, msg) { try { navigator.clipboard.writeText(text).then(() => host.toast(msg), () => host.toast(text)); } catch (e) { host.toast(text); } },
    linkBase: '',
    lessonTitle: id => LESSONS[id] ? LESSONS[id].title : null,
    fmtDate: ts => { try { return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { return ''; } },
    icon: { ok: '✓', bad: '✗' }
  };

  // Engines: role-play rules and scoring options all on, as in Inspect & Adapt V34 and Blast Radius.
  const craft = K.craft.create({ packets: BANK.craft, appKey: APP, keyStyle: 'slug', domain: 'operations and quality', factsSubject: 'process, data, suppliers or people', host });
  const sims = K.sims.create({ runs: BANK.runs, roleplays: BANK.roleplays, appKey: APP, runNoun: 'Simulation', rpHeading: 'Role-plays', host,
    roleplay: { learner: 'operations leader', rules: ['guarded', 'noCoaching', 'noUnpromptedOffer'], scoring: ['outcomeAgreesWithScore', 'verifiedQuotes'] } });

  const draftChip = x => x && x.status === 'Draft' ? '<span class="cchip draft">Draft</span>' : '';
  const itemRow = (href, title, meta, status) => '<a class="itemrow" href="' + esc(href) + '"><span class="top"><b>' + esc(title) + '</b>' + draftChip({ status }) + '</span>' + (meta ? '<span class="k">' + esc(meta) + '</span>' : '') + '</a>';
  // Deck progress: a question counts as right if its last answer was right.
  const qRec = id => decks.get(id);
  const deckStats = d => { const qs = d.questions, seen = qs.filter(q => qRec(q.id)), right = seen.filter(q => qRec(q.id).last === 1); const got = d.cards.filter(c => (decks.get(c.id) || {}).mark === 'got').length; return { n: qs.length, seen: seen.length, right: right.length, cards: d.cards.length, got }; };
  const lessonStats = (d, l) => { const qs = d.questions.filter(q => q.lesson === l.id); return { n: qs.length, right: qs.filter(q => (qRec(q.id) || {}).last === 1).length }; };

  function renderHome() {
    const last = prefs.get('lane'), g = game();
    app.innerHTML = '<header class="mast"><div class="wrap"><div class="brand">Throughput</div><p class="sub">Operations: quality and process improvement, supply chain, and the COO chair.</p>' +
      '<div class="pills"><span class="pill">study-kit <b>' + esc(BANK.kitVersion) + '</b></span><span class="pill" id="prefs-saved">' + esc(prefs.statusText()) + '</span></div></div></header>' +
      '<main class="wrap">' +
      '<section aria-labelledby="ln-h"><div class="section-h"><h2 id="ln-h">Lanes</h2><span class="hint">Built in order: quality, supply chain, then COO</span></div><div class="lanelist">' +
      LANES.map(l => '<button class="lanebtn" style="--deck:var(' + l.color + ')" data-act="lane" data-id="' + l.id + '"' + (l.active ? '' : ' disabled aria-disabled="true"') + '>' +
        '<span class="nm">' + esc(l.name) + '</span><span class="bl">' + esc(l.blurb) + '</span>' +
        '<span class="st">' + (l.active ? (last && last.v === l.id ? 'Open · last visited' : 'Open') : 'Later') + '</span></button>').join('') +
      '</div></section>' +
      '<section aria-labelledby="sm-h"><div class="section-h"><h2 id="sm-h">Simulations</h2><span class="hint">Joins the Supply chain lane when it opens</span></div><div class="items">' +
      itemRow('#beer-game', BEER.title, (g ? 'In progress · ' + BG.SEATS[g.seat] : 'Supply chain · bullwhip · 32 weekly orders'), BEER.status) + '</div></section>' + foot() + '</main>';
  }
  function renderLane() {
    const l = laneById(VIEW.id);
    if (!l || !l.active) return host.go('home', {});
    const secs = SECTIONS[l.id] || [];
    app.innerHTML = host.header(l.short + ' lane', 'home', '', 'Back to lanes', l.cert ? 'Green Belt' : '') +
      '<main class="wrap"><section class="card" style="display:grid;gap:10px"><h2 class="ttl" style="font-size:19px">' + esc(l.name) + '</h2><p class="note">' + esc(l.blurb) + '</p>' +
      (BANK.exam[l.id] ? '<p class="note"><b>The exam:</b> ' + esc(BANK.exam[l.id]) + '</p>' : '') + '</section>' +
      '<section aria-labelledby="sc-h"><div class="section-h"><h2 id="sc-h">Sections</h2><span class="hint">Weighted as the exam is</span></div><div class="card" style="padding-block:4px">' +
      secs.map(s => { const d = deckById(s.id), st = d && deckStats(d);
        return '<div class="secrow" id="' + esc(l.id + '-' + s.id) + '"><div class="top"><b>' + esc(s.title) + '</b>' + (d || (s.id === 'mock' && MOCK) ? '<span class="k">' + esc(s.kind) + '</span>' : '<span class="soon">Phase ' + s.phase + '</span>') + '</div>' +
          (d ? '<div class="items">' + itemRow('#deck-' + d.id, d.title + ' deck', s.questions + ' of 100 scored questions · ' + d.lessons.length + ' lessons · ' + st.right + ' of ' + st.n + ' right', 'Draft') + '</div>'
            : s.id === 'mock' && MOCK ? '<div class="items">' + itemRow('#mock', MOCK.title, mockMeta(), MOCK.status) + '</div>'
            : '<span class="k">' + esc(s.kind) + (s.questions ? ' · ' + s.questions + ' of 100 scored questions' : '') + ' · not built yet</span>') + '</div>'; }).join('') +
      '</div></section>' + foot() + '</main>';
  }

  // ---- decks
  function renderDeck() {
    const d = deckById(VIEW.id); if (!d) return host.go('lane', { id: 'quality' });
    const st = deckStats(d);
    app.innerHTML = host.header(d.title, 'lane', 'quality', 'Back to the Quality lane', d.scored + ' of 100') +
      '<main class="wrap"><section class="card" style="display:grid;gap:10px"><div class="row"><span class="cchip draft">Draft</span><span class="lvchip">ASQ BoK section ' + esc(d.bok) + '</span></div>' +
      '<div class="stat"><div><span class="v">' + st.right + '/' + st.n + '</span><span class="l">questions right (last try)</span></div><div><span class="v">' + st.got + '/' + st.cards + '</span><span class="l">cards marked Got it</span></div></div>' +
      '<div class="row"><button class="btn btn-primary" data-act="practice" data-id="' + d.id + '">Practice 10</button><a class="btn" href="#cards-' + d.id + '">Recall cards</a></div>' +
      '<p class="note" id="deck-saved">' + esc(decks.statusText()) + '</p></section>' +
      '<section aria-labelledby="ls-h"><div class="section-h"><h2 id="ls-h">Lessons</h2><span class="hint">In Body of Knowledge order</span></div><div class="items">' +
      d.lessons.map(l => { const s = lessonStats(d, l); return itemRow('#lesson-' + l.id, l.title, l.bok + ' · ' + s.n + ' questions · ' + s.right + ' right', l.status); }).join('') + '</div></section>' + foot() + '</main>';
  }
  function saveAnswer(id, right) { const r = qRec(id) || { n: 0, right: 0 }; decks.put(id, { ts: Date.now(), n: (r.n || 0) + 1, right: (r.right || 0) + (right ? 1 : 0), last: right ? 1 : 0 }); }
  const PICKS = {};   // lesson answers shown on this visit
  function questionCard(q, pick, act) {
    const done = pick !== undefined;
    return '<section class="card" style="display:grid;gap:10px" id="q-' + esc(q.id.toLowerCase()) + '"><div class="row"><span class="qid">' + esc(q.id) + '</span>' + draftChip(q) + '<span class="lvchip">' + esc(q.bok + ' · ' + q.level) + '</span></div><p class="stem">' + esc(q.stem) + '</p><div class="opts" role="group" aria-label="Options">' +
      q.options.map((o, j) => { const cls = !done ? '' : j === q.answer ? ' is-correct' : j === pick ? ' is-wrong' : '';
        return '<button class="opt' + cls + '" data-act="' + act + '" data-id="' + esc(q.id) + '" data-j="' + j + '"' + (done ? ' disabled' : '') + '><span class="key" aria-hidden="true">' + 'ABCD'[j] + '</span><span>' + esc(o) +
          (done && j === q.answer ? '<span class="tag">Answer</span>' : done && j === pick ? '<span class="tag">Your pick</span>' : '') + '</span></button>'; }).join('') + '</div>' +
      (done ? '<p class="verdict ' + (pick === q.answer ? 'ok' : 'bad') + '">' + (pick === q.answer ? 'Right' : 'Not quite') + '</p><p>' + esc(q.why) + '</p>' + (pick !== q.answer ? '<p class="note">' + esc(q.whyNot[pick]) + '</p>' : '') : '') + '</section>';
  }
  function renderLesson() {
    const l = LESSONS[VIEW.id]; if (!l) return host.go('lane', { id: 'quality' });
    const d = deckById(l.deck), i = d.lessons.findIndex(x => x.id === l.id), next = d.lessons[i + 1];
    const qs = d.questions.filter(q => q.lesson === l.id);
    app.innerHTML = host.header(d.title, 'deck', d.id, 'Back to the ' + d.title + ' deck', (i + 1) + ' of ' + d.lessons.length) +
      '<main class="wrap"><article class="card prose" style="display:grid;gap:12px"><div class="row">' + draftChip(l) + '<span class="lvchip">BoK ' + esc(l.bok) + '</span></div><h2 class="ttl" style="font-size:20px">' + esc(l.title) + '</h2>' +
      l.body.map((p, k) => '<p>' + esc(p) + '</p>' + (l.figs || []).filter(g => g.after === k).map(g => '<figure class="lfig">' + g.svg +   // built from checked numbers in build.js (math/figs.js)
        '<figcaption class="legend">' + g.legend.map(x => '<span><i style="background:var(' + esc(x[0]) + ')"></i>' + esc(x[1]) + '</span>').join('') + '</figcaption></figure>').join('')).join('') +
      '<h3 class="k">Sources</h3><ul class="src">' + l.sources.map(s => '<li><a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a> <span class="lvchip">' + esc(s[2]) + '</span></li>').join('') + '</ul></article>' +
      '<section aria-labelledby="lq-h" style="display:grid;gap:12px"><div class="section-h"><h2 id="lq-h">Check yourself</h2><span class="hint">' + qs.length + ' questions</span></div>' + qs.map(q => questionCard(q, PICKS[q.id], 'pick')).join('') + '</section>' +

  }
  function renderMockReview(r) {
    const answered = Object.keys(r.picks).length, flagged = Object.keys(r.flags).length;
    const show = r.ids.map((id, k) => [id, k]).filter(([id]) => !VIEW.flaggedOnly || r.flags[id]);
    app.innerHTML = '<div class="playtop"><div class="wrap"><button class="iconbtn" data-act="mock-go" data-id="' + r.i + '" aria-label="Back to the question">' + X + '</button><h1 class="ttl">Review</h1>' +
      '<span class="meta"><span class="timer' + (msLeft(r) < 15 * 60000 ? ' low' : '') + '" id="mock-clock" role="timer" aria-label="Time left">' + clock(msLeft(r)) + '</span></span></div></div>' +
      '<main class="wrap" style="display:grid;gap:12px"><section class="card" style="display:grid;gap:10px"><div class="stat"><div><span class="v">' + answered + '/' + r.ids.length + '</span><span class="l">answered</span></div><div><span class="v">' + flagged + '</span><span class="l">flagged</span></div></div>' +
      '<button class="tog" data-act="mock-flagged" aria-pressed="' + !!VIEW.flaggedOnly + '">Only flagged</button>' +
      '<div class="mgrid" role="list">' + show.map(([id, k]) => '<button role="listitem" class="' + [r.picks[id] !== undefined ? 'ans' : '', r.flags[id] ? 'flg' : '', k === r.i ? 'cur' : ''].join(' ').trim() + '" data-act="mock-go" data-id="' + k + '" aria-label="Question ' + (k + 1) + (r.picks[id] !== undefined ? ', answered' : ', not answered') + (r.flags[id] ? ', flagged' : '') + '">' + (k + 1) + '</button>').join('') + '</div>' +
      (show.length ? '' : '<p class="note">No flagged questions.</p>') +
      '<p class="note">Shaded: answered. Outlined: flagged.</p>' +
      '<div class="row"><button class="btn btn-primary" data-act="mock-submit">Submit the mock</button><button class="btn" data-act="mock-go" data-id="' + r.i + '">Back to question ' + (r.i + 1) + '</button></div>' +
      '<div class="row"><button class="btn btn-quiet" data-act="mock-quit">Abandon this mock</button></div><p class="note" id="mock-saved">' + esc(mock.statusText()) + '</p></section>' + foot() + '</main>';
    tick();
  }
  function renderMockResults(last) {
    const misses = last.ids.filter(id => QS[id] && last.picks[id] !== QS[id].answer);
    app.innerHTML = host.header('Mock result', 'lane', 'quality', 'Back to the Quality lane', 'Draft') + '<main class="wrap" style="display:grid;gap:12px">' +
      '<section class="card" style="display:grid;gap:10px"><div class="row"><span class="cchip draft">Draft</span><span class="k">' + (last.timedOut ? 'Time ran out' : 'Submitted') + ' · ' + clock(last.usedMs) + ' used</span></div>' +
      '<div class="stat" id="mock-score"><div><span class="v">' + last.right + '/' + last.total + '</span><span class="l">right</span></div><div><span class="v">' + pct(last.right, last.total) + '</span><span class="l">percent right</span></div></div>' +
      '<p class="note">' + esc(MOCK.scoring) + '</p>' +
      '<div class="scroll"><table class="t" id="mock-by"><thead><tr><th>Section</th><th>Right</th><th>%</th></tr></thead><tbody>' + MOCK.order.map(id => { const b = (last.by || {})[id] || [0, 0]; return '<tr><td><a href="#deck-' + esc(id) + '">' + esc(secTitle(id)) + '</a></td><td>' + b[0] + '/' + b[1] + '</td><td>' + pct(b[0], b[1]) + '</td></tr>'; }).join('') + '</tbody></table></div></section>' +
      '<section aria-labelledby="mm-h"><div class="section-h"><h2 id="mm-h">Missed questions</h2><span class="hint">' + misses.length + ' · each links to its lesson</span></div><div class="card" style="display:grid;gap:8px">' +
      (misses.length ? '<ul class="src" id="mock-misses">' + misses.map(id => { const q = QS[id], l = LESSONS[q.lesson]; return '<li><a href="#lesson-' + esc(q.lesson) + '">' + esc(id) + ' · ' + esc(l.title) + '</a> <span class="k">' + (last.picks[id] === undefined ? 'not answered' : 'you picked ' + 'ABCD'[last.picks[id]] + ', answer ' + 'ABCD'[q.answer]) + '</span></li>'; }).join('') + '</ul>' : '<p class="note">None.</p>') + '</div></section>' +
      '<div class="row"><button class="btn btn-primary" data-act="mock-start">Start a new mock</button><a class="btn" href="#lane-quality">Back to the lane</a></div><p class="note" id="mock-saved">' + esc(mock.statusText()) + '</p>' + foot() + '</main>';
  }

  function foot() {
    const t = theme();
    return '<footer class="foot"><div class="row"><span>Theme:</span>' + ['system', 'light', 'dark'].map(x => '<button class="tog" data-act="theme" data-id="' + x + '" aria-pressed="' + (t === x) + '">' + x[0].toUpperCase() + x.slice(1) + '</button>').join('') + '</div>' +
      '<p>Engines: study-kit ' + esc(BANK.kitVersion) + '. Draft content has not been reviewed yet. Claude grading and role-plays work when this page is open in Claude; everything else works without it.</p></footer>';
  }

  const SCREENS = Object.assign({ home: renderHome, lane: renderLane, deck: renderDeck, lesson: renderLesson, practice: renderPractice, cards: renderCards, beer: renderBeer, mock: renderMock }, craft.screens, sims.screens);
  const ACT = Object.assign({
    home() { history.replaceState(null, '', location.pathname + location.search); host.go('home', {}); },
    lane(t) { const l = laneById(t.dataset.id); if (!l || !l.active) return; prefs.put('lane', { ts: Date.now(), v: l.id }); history.replaceState(null, '', '#lane-' + l.id); host.go('lane', { id: l.id }); },
    deck(t) { history.replaceState(null, '', '#deck-' + t.dataset.id); host.go('deck', { id: t.dataset.id }); },
    theme(t) { try { localStorage.setItem(THEME_KEY, t.dataset.id); } catch (e) { /* storage unavailable */ } applyTheme(t.dataset.id); host.keepScroll(); },
    pick(t) { const q = QS[t.dataset.id]; if (!q || PICKS[q.id] !== undefined) return; const j = +t.dataset.j; PICKS[q.id] = j; saveAnswer(q.id, j === q.answer); host.keepScroll(); },
    practice(t) { const d = deckById(t.dataset.id); history.replaceState(null, '', '#practice-' + d.id); host.go('practice', { deck: d.id, ids: practiceSet(d), i: 0, picks: {} }); },
    ppick(t) { const q = QS[t.dataset.id]; if (!q || VIEW.picks[q.id] !== undefined) return; const j = +t.dataset.j; VIEW.picks[q.id] = j; saveAnswer(q.id, j === q.answer); host.keepScroll(); },
    pnext() { VIEW.i = (VIEW.i || 0) + 1; host.render(); window.scrollTo(0, 0); },
    'card-flip'() { VIEW.flip = true; host.keepScroll(); },
    'card-skip'() { VIEW.flip = false; VIEW.i = ((VIEW.i || 0) + 1) % Math.max(1, cardList().length); host.keepScroll(); },
    'card-mark'(t) { const list = cardList(), c = list[Math.min(VIEW.i || 0, list.length - 1)]; if (!c) return;
      decks.put(c.id, { ts: Date.now(), mark: t.dataset.id }); VIEW.flip = false;
      if (!(VIEW.again && t.dataset.id === 'got')) VIEW.i = (VIEW.i || 0) + 1;   // in "Again only", a card marked Got it leaves the list
      if (VIEW.i >= cardList().length) VIEW.i = 0; host.keepScroll(); },
    'cards-only'() { VIEW.again = !VIEW.again; VIEW.i = 0; VIEW.flip = false; host.keepScroll(); },
    'beer-seat'(t) { VIEW.seat = +t.dataset.id; host.keepScroll(); },
    'beer-start'(t) { beer.put('game', { ts: Date.now(), seat: +t.dataset.id, orders: [] }); host.go('beer', {}); },
    'beer-new'() { host.go('beer', { seat: 1 }); },
    'beer-debrief'() { host.go('beer', { debrief: true }); },
    'beer-inc'() { const q = qtyNow(); VIEW.qty = Math.min(999, (q === null ? 0 : q) + 1); host.keepScroll(); },
    'beer-dec'() { const q = qtyNow(); VIEW.qty = Math.max(0, (q === null ? 0 : q) - 1); host.keepScroll(); },
    'beer-order'() { placeOrder(qtyNow()); },
    'beer-same'() { const g = game(); placeOrder(g && g.orders && g.orders.length ? g.orders[g.orders.length - 1] : 4); },
    'mock-pause-opt'() { VIEW.allowPause = !VIEW.allowPause; host.keepScroll(); },
    'mock-start'() { const ids = drawMock(); mock.put('run', { ts: Date.now(), ids, picks: {}, flags: {}, start: Date.now(), allowPause: !!VIEW.allowPause, pausedAt: 0, pausedMs: 0, i: 0 }); host.go('mock', {}); },
    'mock-pick'(t) { const r = run(); if (!r || r.pausedAt) return; r.picks[t.dataset.id] = +t.dataset.j; putRun(r); host.keepScroll(); },
    'mock-flag'() { const r = run(); if (!r) return; const id = r.ids[r.i]; if (r.flags[id]) delete r.flags[id]; else r.flags[id] = 1; putRun(r); host.keepScroll(); },
    'mock-go'(t) { const r = run(); if (!r) return; r.i = Math.max(0, Math.min(r.ids.length - 1, +t.dataset.id)); putRun(r); VIEW.review = false; host.render(); window.scrollTo(0, 0); },
    'mock-review'() { VIEW.review = true; VIEW.flaggedOnly = false; host.render(); window.scrollTo(0, 0); },
    'mock-flagged'() { VIEW.flaggedOnly = !VIEW.flaggedOnly; host.keepScroll(); },
    'mock-pause'() { const r = run(); if (!r || !r.allowPause || r.pausedAt) return; r.pausedAt = Date.now(); putRun(r); host.keepScroll(); },
    'mock-resume'() { const r = run(); if (!r || !r.pausedAt) return; r.pausedMs += Date.now() - r.pausedAt; r.pausedAt = 0; putRun(r); host.keepScroll(); },
    'mock-submit'() { const r = run(); if (!r) return; const left = r.ids.filter(id => r.picks[id] === undefined).length;
      if (left) host.confirm('Submit the mock?', left + ' question' + (left === 1 ? ' is' : 's are') + ' unanswered and will be marked wrong.', 'Submit', () => finishMock(r)); else finishMock(r); },
    'mock-quit'() { host.confirm('Abandon this mock?', 'Your answers so far are discarded and nothing is scored.', 'Abandon', () => { mock.put('run', { ts: Date.now(), done: true }); host.go('mock', {}); }); },
    'mock-last'() { host.go('mock', { results: true }); },
    'beer-quit'() { host.confirm('Abandon this game?', 'Your orders so far are discarded.', 'Abandon', () => { beer.put('game', { ts: Date.now(), done: true }); host.go('beer', {}); }); }
  }, craft.actions, sims.actions);
  function render() { (SCREENS[SCREEN] || renderHome)(); }

  // Routes: dash form only. Craft and Simulations route their own (#craft, #sims).
  function route(h) {
    let m;
    if ((m = /^#lane-([a-z0-9-]+)$/.exec(h || ''))) { const l = laneById(m[1]); if (l && l.active) { host.go('lane', { id: l.id }); return true; } host.go('home', {}); return true; }
    if ((m = /^#deck-([a-z0-9-]+)$/.exec(h || '')) && deckById(m[1])) { host.go('deck', { id: m[1] }); return true; }
    if ((m = /^#cards-([a-z0-9-]+)$/.exec(h || '')) && deckById(m[1])) { host.go('cards', { id: m[1], i: 0 }); return true; }
    if ((m = /^#practice-([a-z0-9-]+)$/.exec(h || '')) && deckById(m[1])) { const d = deckById(m[1]); host.go('practice', { deck: d.id, ids: practiceSet(d), i: 0, picks: {} }); return true; }
    if ((m = /^#lesson-([a-z]+-\d+)$/.exec(h || '')) && LESSONS[m[1]]) { host.go('lesson', { id: m[1] }); return true; }
    if (h === '#beer-game') { host.go('beer', {}); return true; }
    if (h === '#mock' && MOCK) { host.go('mock', {}); return true; }
    return craft.route(h) || sims.route(h);
  }
  document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t || t.disabled) return; const fn = ACT[t.dataset.act]; if (fn) fn(t, e); });
  document.addEventListener('input', e => { if (e.target && e.target.id === 'beer-qty') { VIEW.qty = e.target.value; return; } craft.onInput(e) || sims.onInput(e); });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'beer-qty') { e.preventDefault(); placeOrder(qtyNow()); } });
  document.addEventListener('toggle', e => { craft.onToggle(e); }, true);
  window.addEventListener('pagehide', () => craft.onPageHide());
  window.addEventListener('hashchange', () => route(location.hash));

  craft.start(); sims.start();
  if (!(location.hash && route(location.hash))) render();

  // Claude capabilities: sample (grading, role-plays), db and user (saving to the account).
  (async () => {
    const C = window.claude;
    if (!C || typeof C.use !== 'function') return;
    try { const fn = await C.use('sample'); if (typeof fn === 'function') { SAMPLE = fn; if (['craft', 'packet', 'stage', 'sims', 'run', 'rp'].indexOf(SCREEN) !== -1) host.keepScroll(); } } catch (e) { /* not granted */ }
    try {
      const db = await C.use('db'), user = await C.use('user'), uid = user && await user.id();
      if (db && uid) { prefs.attach(db, uid); decks.attach(db, uid); beer.attach(db, uid); mock.attach(db, uid); craft.attach(db, uid); sims.attach(db, uid); if (SCREEN === 'home') host.keepScroll(); }
    } catch (e) { /* saved on this device only */ }
  })();
  window.__tp = { craft, sims, prefs, decks, beer, mock, host, drawMock };
})();
</script>
</body>
</html>
